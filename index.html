<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client–Vendor Relationship Map</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#38506d;--text:#edf5ff;--muted:#9bb0c8;--client:#47d7ac;--vendor:#67a8ff;--manager:#ffc857;--recruiter:#ff7d9c}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 15% 0,#15355a 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:1500px;margin:auto;padding:28px 18px 48px} h1{font-size:clamp(26px,5vw,48px);line-height:1.05;margin:0 0 8px;letter-spacing:-.04em} .sub{color:var(--muted);max-width:760px;margin:0 0 22px}
    .toolbar,.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar{margin-bottom:14px}.legend{margin-left:auto}.pill,.search{border:1px solid #29415e;background:#0a1728;color:var(--text);border-radius:999px}.pill{padding:7px 11px}.search{padding:10px 14px;min-width:min(100%,290px);outline:none}.search:focus{border-color:#67a8ff;box-shadow:0 0 0 3px #67a8ff22}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
    .card{background:linear-gradient(180deg,#0e1e32ee,#091524ee);border:1px solid #233b58;border-radius:20px;box-shadow:0 24px 70px #0007;overflow:hidden}.headings{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 32px;border-bottom:1px solid #233b58;color:#b9cbe0;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.12em}.stage{overflow:auto}.stage svg{display:block;width:100%;min-width:920px;height:auto}
    .edge{stroke:var(--line);stroke-width:2;fill:none;opacity:.55}.edge.inactive{opacity:.07}.node{cursor:pointer}.node circle{stroke:#dbeaff55;stroke-width:2;filter:drop-shadow(0 8px 13px #0008);transition:.18s}.node:hover circle,.node.active circle{stroke:#fff;stroke-width:3}.node.inactive{opacity:.16}.node text{pointer-events:none;fill:#fff;text-anchor:middle;font-weight:720;font-size:13px}.node .small{font-size:10px;fill:#d3e1f1;font-weight:550}.status{stroke-dasharray:5 4}.footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;color:var(--muted);border-top:1px solid #233b58}.detail{color:#dbeaff}.empty{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:700px){main{padding:20px 10px}.legend{margin-left:0}.headings{min-width:920px}.card{border-radius:14px}}
  </style>
</head>
<body>
<main>
  <h1>Client–Vendor Relationship Map</h1>
  <p class="sub">A living view of end clients, approved vendors, account managers, and recruiters. Select a bubble to trace its relationship path.</p>
  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="Search client, vendor, or contact…" aria-label="Search relationships">
    <span class="pill">Solid = confirmed</span><span class="pill">Dashed = prospect</span>
    <div class="legend" id="legend"></div>
  </div>
  <section class="card">
    <div class="headings"><span>Client</span><span>Vendor</span><span>Account manager</span><span>Recruiter</span></div>
    <div class="stage"><svg id="graph" viewBox="0 0 1200 660" role="img" aria-label="Bubble graph of clients, vendors, account managers, and recruiters"></svg></div>
    <div class="footer"><span id="summary"></span><span class="detail" id="detail">Select a bubble to inspect a relationship.</span></div>
  </section>
</main>
<script>
const data = {
  nodes: [
    {id:'hcsc',type:'client',label:'HCSC',status:'confirmed'},
    {id:'swoon',type:'vendor',label:'Swoon',status:'confirmed'},
    {id:'launch',type:'vendor',label:'Launch / Strive',status:'prospect'},
    {id:'mastech',type:'vendor',label:'Mastech Digital',status:'prospect'},
    {id:'khristiana-randazzo',type:'manager',label:'Khristiana Randazzo',subtitle:'Account Manager',status:'confirmed'},
    {id:'antoine-smith',type:'manager',label:'Antoine Smith',subtitle:'Enterprise Account Manager',status:'prospect'},
    {id:'nikolas-darrus',type:'manager',label:'Nikolas Darrus',subtitle:'Prospective contact',status:'prospect'},
    {id:'khais-khan',type:'manager',label:'Khais Khan',subtitle:'Executive Client Partner',status:'prospect'},
    {id:'neha-naithani',type:'recruiter',label:'Neha Naithani',subtitle:'Sr. Recruitment Consultant',status:'prospect'},
    {id:'swoon-recruiter-tbd',type:'recruiter',label:'Recruiter TBD',subtitle:'Swoon',status:'unknown'},
    {id:'launch-recruiter-tbd',type:'recruiter',label:'Recruiter TBD',subtitle:'Launch / Strive',status:'unknown'}
  ],
  links: [
    {source:'hcsc',target:'swoon',status:'confirmed'},
    {source:'hcsc',target:'launch',status:'prospect'},
    {source:'hcsc',target:'mastech',status:'prospect'},
    {source:'swoon',target:'khristiana-randazzo',status:'confirmed'},
    {source:'swoon',target:'antoine-smith',status:'prospect'},
    {source:'launch',target:'nikolas-darrus',status:'prospect'},
    {source:'mastech',target:'khais-khan',status:'prospect'},
    {source:'mastech',target:'neha-naithani',status:'prospect'},
    {source:'swoon',target:'swoon-recruiter-tbd',status:'unknown'},
    {source:'launch',target:'launch-recruiter-tbd',status:'unknown'}
  ]
};
const colors={client:'#47d7ac',vendor:'#67a8ff',manager:'#ffc857',recruiter:'#ff7d9c'}, names={client:'Client',vendor:'Vendor',manager:'Account manager',recruiter:'Recruiter'};
const svg=document.querySelector('#graph'), search=document.querySelector('#search'), detail=document.querySelector('#detail');
document.querySelector('#legend').innerHTML=Object.entries(names).map(([k,v])=>`<span class="pill"><i class="dot" style="background:${colors[k]}"></i>${v}</span>`).join('');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wrap(label,max=18){const words=label.split(' '),lines=[''];for(const w of words){const last=lines.length-1;if((lines[last]+' '+w).trim().length>max&&lines[last]) lines.push(w);else lines[last]=(lines[last]+' '+w).trim()}return lines.slice(0,2)}
function render(query=''){
  const q=query.trim().toLowerCase(); const matching=new Set(data.nodes.filter(n=>!q||`${n.label} ${n.subtitle||''}`.toLowerCase().includes(q)).map(n=>n.id));
  const visible=new Set(matching); if(q){for(let i=0;i<3;i++) for(const l of data.links) if(visible.has(l.source)||visible.has(l.target)){visible.add(l.source);visible.add(l.target)}} else data.nodes.forEach(n=>visible.add(n.id));
  const columns={client:150,vendor:450,manager:750,recruiter:1050}; const byType={client:[],vendor:[],manager:[],recruiter:[]}; data.nodes.forEach(n=>byType[n.type].push(n));
  const positions={}; for(const [type,nodes] of Object.entries(byType)){const gap=560/(nodes.length+1);nodes.forEach((n,i)=>positions[n.id]={x:columns[type],y:52+gap*(i+1)})}
  const links=data.links.map(l=>{const a=positions[l.source],b=positions[l.target];return `<path class="edge ${l.status==='confirmed'?'':'status'} ${q&&(!visible.has(l.source)||!visible.has(l.target))?'inactive':''}" data-a="${l.source}" data-b="${l.target}" d="M${a.x+62},${a.y} C${a.x+150},${a.y} ${b.x-150},${b.y} ${b.x-62},${b.y}"/>`}).join('');
  const nodes=data.nodes.map(n=>{const p=positions[n.id],lines=wrap(n.label),inactive=q&&!visible.has(n.id);return `<g class="node ${n.status==='confirmed'?'':'status'} ${inactive?'inactive':''}" data-id="${n.id}" transform="translate(${p.x} ${p.y})" tabindex="0" role="button"><circle r="${n.type==='client'?66:58}" fill="${colors[n.type]}" fill-opacity=".88"/><text>${lines.map((x,i)=>`<tspan x="0" dy="${i?16:lines.length>1?-4:3}">${esc(x)}</tspan>`).join('')}${n.subtitle?`<tspan class="small" x="0" dy="17">${esc(n.subtitle.length>25?n.subtitle.slice(0,24)+'…':n.subtitle)}</tspan>`:''}</text><title>${esc(n.label)} — ${names[n.type]} — ${n.status}</title></g>`}).join('');
  svg.innerHTML=links+nodes; document.querySelector('#summary').textContent=`${byType.client.length} client · ${byType.vendor.length} vendors · ${byType.manager.length} account contacts · ${byType.recruiter.length} recruiter records`;
  svg.querySelectorAll('.node').forEach(el=>{const select=()=>highlight(el.dataset.id);el.addEventListener('click',select);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}})});
}
function highlight(id){const n=data.nodes.find(x=>x.id===id),related=new Set([id]);data.links.forEach(l=>{if(l.source===id)related.add(l.target);if(l.target===id)related.add(l.source)});svg.querySelectorAll('.node').forEach(el=>{el.classList.toggle('active',el.dataset.id===id);el.classList.toggle('inactive',!related.has(el.dataset.id))});svg.querySelectorAll('.edge').forEach(el=>el.classList.toggle('inactive',el.dataset.a!==id&&el.dataset.b!==id));detail.textContent=`${n.label} · ${names[n.type]} · ${n.status}`}
search.addEventListener('input',e=>render(e.target.value)); render();
</script>
</body>
</html>
